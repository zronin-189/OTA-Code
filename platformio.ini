; =============================================================================
; PLATFORMIO CONFIGURATION FOR ESP32-S3-N16R8 (16MB Flash, 8MB PSRAM)
; =============================================================================

[platformio]
default_envs = esp32s3_n16r8_ble

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; --- Môi trường 1 (Bản gốc nạp vào Board): Bluetooth BLE Test (v1.0.0) ---
[env:esp32s3_n16r8_ble]
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFW_FEATURE_BLE=1
    -DFW_VERSION_STR=\"1.0.0\"

; --- Môi trường 2 (Firmware Test OTA 1): Quét Wi-Fi Scanner (v1.1.0) ---
[env:esp32s3_n16r8_wifi_scan]
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFW_FEATURE_WIFI_SCAN=1
    -DFW_VERSION_STR=\"1.1.0\"

; --- Môi trường 3 (Firmware Test OTA 2): Đồng bộ giờ RTC Web SNTP (v1.2.0) ---
[env:esp32s3_n16r8_rtc_web]
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFW_FEATURE_RTC_WEB=1
    -DFW_VERSION_STR=\"1.2.0\"
